<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <title>实时聊天室</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="login" class="login-screen">
      <div class="aurora" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
      </div>

      <form id="login-form" class="login-card" autocomplete="off">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg>
        </div>

        <h1>实时聊天室</h1>
        <p class="subtitle">输入昵称，和朋友即刻开聊</p>

        <div class="field">
          <label for="nickname">昵称</label>
          <input id="nickname" name="nickname" maxlength="24" placeholder="例如：小明" required />
        </div>

        <div class="field">
          <label for="room">房间</label>
          <input id="room" name="room" maxlength="40" placeholder="例如：general" value="general" required />
        </div>

        <div class="field hidden" id="password-field">
          <label for="chat-password">访问密码</label>
          <input
            id="chat-password"
            name="password"
            type="password"
            maxlength="128"
            placeholder="请输入访问密码"
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="enter-btn">
          <span>进入聊天室</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>

        <p id="login-error" class="error" role="alert"></p>
        <p class="hint">同一个房间名的人可以互相看到消息</p>
      </form>
    </div>

    <div id="app" class="app hidden">
      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          </div>
          <div class="brand-text">
            <strong>实时聊天室</strong>
            <span class="muted">Realtime Chat</span>
          </div>
        </div>

        <div class="room-pill">
          <span class="hash">#</span>
          <span id="room-name">general</span>
        </div>

        <div class="section-title">在线成员 <span id="user-count" class="badge">0</span></div>
        <ul id="user-list" class="user-list"></ul>

        <div class="sidebar-footer">
          <button id="leave-btn" class="leave-btn" type="button">退出房间</button>
        </div>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <button
            id="menu-btn"
            class="menu-btn"
            type="button"
            aria-label="查看在线成员"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span id="menu-count" class="menu-count">0</span>
          </button>

          <div class="room-heading">
            <div class="room-avatar" aria-hidden="true">#</div>
            <div class="room-meta">
              <h2 id="chat-title">general</h2>
              <p>欢迎来到实时聊天室</p>
            </div>
          </div>
          <span id="connection" class="status online">已连接</span>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="typing" class="typing"></div>

        <form id="message-form" class="composer" autocomplete="off">
          <input
            id="message-input"
            name="message"
            maxlength="2000"
            placeholder="输入消息，回车发送..."
            autocomplete="off"
          />
          <button type="submit" aria-label="发送消息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4 20-7z" />
            </svg>
          </button>
        </form>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
